<header class="topbar">
  <a class="logo" routerLink="/" aria-label="StatSheets home">STAT<span>SHEETS</span></a>
  <nav class="nav" aria-label="Pages">
    @for (n of nav; track n.path) {
      <a class="nav-link" [routerLink]="n.path" routerLinkActive="active" data-sfx-click data-sfx-hover>{{ n.label }}</a>
    }
  </nav>
  <a class="nav-link new" routerLink="/new" data-sfx-click>+ NEW CHARACTER</a>
  <button class="mute" type="button" (click)="sound.toggleMute()" [attr.aria-pressed]="sound.muted()"
          [attr.aria-label]="sound.muted() ? 'Unmute sounds' : 'Mute sounds'">
    {{ sound.muted() ? 'SFX OFF' : 'SFX ON' }}
  </button>
</header>

<main class="page">
  <router-outlet />
</main>

@if (sandboxLabel) {
  <div class="sandbox" role="status">{{ sandboxLabel }}</div>
}

<ss-confirm-host />

<div class="toasts" aria-live="polite">
  @for (n of notifier.notices(); track n.id) {
    <div class="toast" [class.err]="n.kind === 'err'" (click)="notifier.dismiss(n.id)">{{ n.text }}</div>
  }
</div>
