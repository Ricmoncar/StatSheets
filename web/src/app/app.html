<header class="topbar">
  <a class="logo" routerLink="/" aria-label="StatSheets home">STAT<span>SHEETS</span></a>
  <nav class="nav" aria-label="Pages">
    @for (n of nav; track n.path) {
      <a class="nav-link" [routerLink]="n.path" routerLinkActive="active" data-sfx-click data-sfx-hover>{{ n.label }}</a>
    }
  </nav>
  <a class="nav-link new" routerLink="/new" data-sfx-click>+ NEW CHARACTER</a>
  <button class="mute" type="button" (click)="settings.togglePerfMode()" [attr.aria-pressed]="settings.perfMode()"
          [title]="settings.perfMode() ? 'Performance mode is ON: animated backgrounds are off. Click to turn off.' : 'Performance mode: turn off the animated backgrounds if the site lags.'">
    {{ settings.perfMode() ? 'PERF: ON' : 'PERF' }}
  </button>
  <ss-sfx-control />
</header>

<main class="page">
  <router-outlet />
</main>

@if (sandboxLabel) {
  <div class="sandbox" role="status">{{ sandboxLabel }}</div>
}

<ss-theme-bar />
<ss-tooltip-host />

<ss-confirm-host />

<div class="toasts" aria-live="polite">
  @for (n of notifier.notices(); track n.id) {
    <div class="toast" [class.err]="n.kind === 'err'" (click)="notifier.dismiss(n.id)">{{ n.text }}</div>
  }
</div>
