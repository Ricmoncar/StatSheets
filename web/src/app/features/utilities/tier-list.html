<div class="tabs" role="tablist" aria-label="Tier lists">
  @for (l of lists(); track l.id) {
    <div class="tab" [class.on]="l.id === activeId()">
      @if (renaming() === l.id) {
        <input #ren class="tab-input" type="text" maxlength="16" [value]="l.name" aria-label="List name"
               (keydown.enter)="ren.blur()" (keydown.escape)="ren.value = l.name; ren.blur()" (blur)="finishRename(l, ren.value)" />
      } @else {
        <button type="button" role="tab" class="tab-name u-btn u-tab sm" [class.on]="l.id === activeId()" [attr.aria-selected]="l.id === activeId()" (click)="activeId.set(l.id)"
                (dblclick)="edit(l.id)" title="Double-click to rename">{{ l.name }}</button>
      }
      @if (lists().length > 1) {
        <button type="button" class="tab-del" (click)="remove(l)" [attr.aria-label]="'Delete ' + l.name"><ss-icon name="x" [soul]="false" /></button>
      }
    </div>
  }
  @if (naming()) {
    <span class="tab new">
      <input #nm class="tab-input" type="text" maxlength="16" placeholder="NAME" aria-label="New list name"
             (keydown.enter)="confirmNew(nm)" (keydown.escape)="naming.set(false)" />
      <button type="button" class="ok u-btn icon sm" (click)="confirmNew(nm)" aria-label="Create"><ss-icon name="check" [soul]="false" /></button>
      <button type="button" class="tab-del" (click)="naming.set(false)" aria-label="Cancel"><ss-icon name="x" [soul]="false" /></button>
    </span>
  } @else {
    <button type="button" class="add u-btn icon sm" (click)="edit('new')" title="New tier list" aria-label="New tier list"><ss-icon name="plus" [soul]="false" /></button>
  }
</div>

@for (r of rows(); track r.tier) {
  <div class="row" [style.--t]="colors[r.tier]">
    <span class="label">{{ r.tier }}</span>
    <div class="slots" [class.over]="dropAt() === 'row:' + r.tier" (click)="rowClick(r.tier)"
         (dragover)="overRow($event, 'row:' + r.tier)" (dragleave)="dropAt.set(null)" (drop)="dropOnRow($event, r.tier)">
      @for (c of r.chars; track c.id) {
        <ng-container *ngTemplateOutlet="chip; context: { $implicit: c, tier: r.tier }" />
      }
    </div>
  </div>
}
<span class="pool-label">UNRANKED</span>
<div class="pool" [class.over]="dropAt() === 'row:pool'" (click)="rowClick(null)"
     (dragover)="overRow($event, 'row:pool')" (dragleave)="dropAt.set(null)" (drop)="dropOnRow($event, null)">
  @for (c of unranked(); track c.id) {
    <ng-container *ngTemplateOutlet="chip; context: { $implicit: c, tier: null }" />
  }
</div>

<ng-template #chip let-c let-tier="tier">
  <button type="button" class="chip" draggable="true" [style.--c]="c.color || '#888'" [ssTip]="tipFor(c)"
          [class.selected]="selected() === c.id" [class.before]="dropAt() === c.id + ':before'" [class.after]="dropAt() === c.id + ':after'"
          (click)="chipClick($event, c)" (dragstart)="dragStart($event, c)" (dragend)="dropAt.set(null)"
          (dragover)="overChip($event, c)" (drop)="dropOnChip($event, c, tier)" [attr.aria-pressed]="selected() === c.id">
    @if (c.avatar) { <img [src]="c.avatar" alt="" draggable="false" /> }
    @else { <i class="u-spr s-soul" aria-hidden="true"></i> }
    <span class="name">{{ c.name }}</span>
  </button>
</ng-template>
