<div class="backdrop u-scrim"></div>

@if (choosing()) {
  <section class="chooser u-voice" role="dialog" aria-modal="true" aria-label="Roll for which form?">
    <header class="bar">
      <span class="u-ast">ROLL FOR WHICH FORM?</span>
      <button type="button" class="u-btn icon sm" (click)="closed.emit()" aria-label="Close"><ss-icon name="x" [soul]="false" /></button>
    </header>
    @for (r of formRows(); track r.idx) {
      <button type="button" class="form-row u-soul-on" [class.on]="r.idx === activeForm()" [class.is-on]="r.idx === activeForm()" (click)="chooseForm(r.idx)">
        <ss-icon name="ast" />
        <span class="fname">{{ r.name }}</span>
        <span class="ftraits">{{ r.traits }}@if (r.inherits) { (inherits base) }</span>
      </button>
    }
  </section>
} @else {
  <section class="stage" role="dialog" aria-modal="true" aria-label="Trait roll">
    <div class="pity">
      <span class="pity-label">PITY <span class="pity-count" [class.max]="pity() >= 100" [class.high]="pity() >= 75 && pity() < 100">{{ pity() }}</span><small>/ 100</small></span>
      <span class="pity-cells" aria-hidden="true">
        @for (n of cells; track n) { <i class="u-spr s-cell" [style.--f]="pity() >= n * 5 ? 2 : pity() > (n - 1) * 5 ? 1 : 0"></i> }
      </span>
    </div>

    <h2 class="title">{{ title() }}</h2>
    <p class="sub">{{ sub() }}</p>

    <div class="cards" [class.shake]="shakeHand()">
      @for (c of cards(); track $index) {
        <button type="button" class="card" [attr.data-rarity]="c.rarity" [class.rolling]="c.rolling" [class.flash]="c.flash"
                [class.shimmy]="!!c.shimmy" [class.notable]="c.notable" [disabled]="!interactive()" (click)="pick($index)"
                [style.border-image-source]="c.rolling ? 'var(--f-cardback)' : 'var(--f-tc-' + look(c.rarity) + ')'">
          @if (c.rolling) {
            <span class="back" aria-hidden="true"><i class="u-spr s-soul" style="--sc: 2"></i></span>
            <span class="rarity">???</span>
          } @else {
            <span class="top">
              <span class="art"><i class="u-spr u-anim" [style.--sheet]="'var(--s-art-' + look(c.rarity) + ')'" style="--w: 20; --h: 20; --n: 8; --fps: 8"></i></span>
              <span class="rarity">{{ rarityLabel(c.rarity) }} @if (c.shimmy) { <span class="mark">{{ shimmyMark(c.shimmy) }}</span> }</span>
            </span>
            <span class="name">{{ c.name }}</span>
            <span class="desc">{{ c.desc }}</span>
            @if (c.notable) { <i class="burst u-spr s-burst u-anim" aria-hidden="true"></i> }
          }
          <span class="cta" [class.hidden]="!interactive()"><ss-icon name="ast" [soul]="false" />TAKE IT</span>
        </button>
      }
    </div>

    <div class="actions">
      <button type="button" class="u-btn" (click)="cancel()"><ss-icon name="x" />CANCEL</button>
      <button type="button" class="u-btn primary" [disabled]="dealing()" (click)="reroll()"><ss-icon name="dice" />REROLL HAND</button>
      <button type="button" class="u-btn" [class.on]="autoMode()" [attr.aria-pressed]="autoMode()" (click)="toggleAuto()"><ss-icon name="play" />AUTO: {{ autoMode() ? 'ON' : 'OFF' }}</button>
    </div>

    @if (autoMode()) {
      <div class="auto">
        <span class="ar-label">STOP AT</span>
        @for (r of stopOptions; track r) {
          <button type="button" class="ar" [class.on]="stopRarity() === r" [attr.data-rarity]="r" (click)="stopRarity.set(r)">{{ r.toUpperCase() }}</button>
        }
        <span class="divider"></span>
        <button type="button" class="ar" [class.on]="stopShimmy()" [attr.aria-pressed]="stopShimmy()" (click)="stopShimmy.set(!stopShimmy())">&#10022; SHIMMY</button>
      </div>
    }
  </section>
}
